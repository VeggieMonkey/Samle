[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pypdf-combiner"
version = "1.0.0"
description = "Right-click Windows context menu tool for merging PDFs with vedlegg ordering"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",
    "customtkinter>=5.2.0",
    "winotify>=1.1.0",
    "psutil>=5.9.0",
]

[project.scripts]
pypdf-combiner = "src.combiner.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
